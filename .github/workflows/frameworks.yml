name: Read-only framework examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frameworks/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm start
      - run: node ../../automation/n8n/validate.mjs
  crewai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frameworks/crewai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.9.2
      - run: uv sync --locked
      - run: uv run --no-sync python -m unittest -v test_tool
      - run: uv run --no-sync python demo.py
